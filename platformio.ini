; CYD Timer — timers & reminders for the LCDwiki 3.5" ESP32-32E (E32R35T) board
; ST7796U 320x480 display + XPT2046 resistive touch, ESP32-WROOM-32E

[env:e32r35t]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv

lib_deps =
  bodmer/TFT_eSPI@2.5.43
  lvgl/lvgl@8.3.11

build_flags =
  -Iinclude
  -DLV_CONF_INCLUDE_SIMPLE
  ; ---- TFT_eSPI setup (no need to edit the library's User_Setup.h) ----
  -DUSER_SETUP_LOADED=1
  -DST7796_DRIVER=1
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DUSE_HSPI_PORT=1
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTOUCH_CS=33
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
